# Tests the add-on and publishes a multi-arch image (amd64 + aarch64) to GHCR.
# The image tag is the version in config.yaml; an existing version is never overwritten,
# so bump the version to release.
name: Build add-on image

on:
  push:
    branches: [main]
    paths: ["zigbee_floorplan/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["zigbee_floorplan/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/joeyjojo747/zigbee-floorplan

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zigbee_floorplan/package-lock.json

      - name: Test
        working-directory: zigbee_floorplan
        run: |
          npm ci
          npm test

      - name: Read version
        id: version
        run: |
          version=$(yq -r '.version' zigbee_floorplan/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$version is already published; building without pushing."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: zigbee_floorplan
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' && steps.version.outputs.exists == 'false' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
