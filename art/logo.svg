<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 100" width="250" height="100">
  <!-- The icon (copied from icon.svg) beside the name, for the add-on store. -->
  <rect width="250" height="100" rx="16" fill="#ffffff"/>
  <svg x="2" y="10" width="80" height="80" viewBox="0 0 128 128">
  <!-- Zigbee Floorplan: a floor plan with mesh links between devices, in the app's colours. -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#ffffff"/>
  <!-- Walls, with door gaps -->
  <g fill="none" stroke="#2b3440" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 18 H18 V110 H110 V18 H76"/>
    <path d="M62 18 V40 M62 56 V68 H46 M32 68 H18"/>
    <path d="M62 68 H82 M98 68 H110"/>
  </g>
  <!-- Links: good (green), fair (amber) -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="38" y1="42" x2="88" y2="40" stroke="#1f9d55"/>
    <line x1="38" y1="42" x2="64" y2="90" stroke="#1f9d55"/>
    <line x1="88" y1="40" x2="64" y2="90" stroke="#d99a06"/>
    <line x1="64" y1="90" x2="36" y2="92" stroke="#1f9d55"/>
    <line x1="64" y1="90" x2="92" y2="92" stroke="#d99a06"/>
  </g>
  <!-- Coordinator, routers, end devices -->
  <g stroke="#ffffff" stroke-width="3">
    <rect x="28" y="32" width="20" height="20" rx="4" fill="#7b3fe4"/>
    <circle cx="88" cy="40" r="10" fill="#1e6fd9"/>
    <circle cx="64" cy="90" r="10" fill="#1e6fd9"/>
    <circle cx="36" cy="92" r="7.5" fill="#18a383"/>
    <circle cx="92" cy="92" r="7.5" fill="#18a383"/>
  </g>
  </svg>
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#2b3440">
    <text x="92" y="46" font-size="25">Zigbee</text>
    <text x="92" y="76" font-size="25">Floorplan</text>
  </g>
</svg>
